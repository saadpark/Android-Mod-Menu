name: Cloud Android NDK Build

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # تشغيل البيئة الافتراضية العادية

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        link-to-sdk: true

    - name: Make Gradle Executable
      run: chmod +x gradlew # تهيئة صلاحيات الملف المحلي الافتراضي للمشروع

    - name: Compile C++ and Build APK
      run: ./gradlew assembleDebug # تشغيل أمر البناء العادي والافتراضي للمستودع
      
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: FreeFire-ModMenu
        path: app/build/outputs/apk/debug/app-debug.apk
